# Route basket: representative city-pairs. Weights = DGCA pax-traffic share (see METHODOLOGY.md).
routes:
  - origin: DEL
    destination: BOM
    weight: 0.2200
  - origin: DEL
    destination: BLR
    weight: 0.2000
  - origin: BOM
    destination: BLR
    weight: 0.1700
  - origin: DEL
    destination: CCU
    weight: 0.1500
  - origin: BLR
    destination: HYD
    weight: 0.1200
  - origin: MAA
    destination: DEL
    weight: 0.1400

advance_windows: [1, 7, 15, 30, 45]

sources:
  airlines: [indigo_direct, airindia_direct, airindia_express, akasa_direct, spicejet_direct]
  otas: [makemytrip, yatra, easemytrip, cleartrip, ixigo, goibibo]

# Kill-switch: set any source to false to disable instantly without code changes.
# Compliance notes (see scraper/form_flows.py + SCRAPING_ETHICS.md):
# - ixigo: scraping PARKED (robots disallows /search/result/, reCAPTCHA gate);
#   live data only via official API hook scraper/ixigo_api.py (IXIGO_API_KEY).
# - makemytrip/goibibo/airindia_express: scraping PARKED (bot-wall / challenge /
#   CAPTCHA); live data only via scraper/provider_apis.py (MMT_*/GOIBIBO_*/AIX_*).
# - cleartrip: only /flights/results is allowed; never scrape /flights/search*.
# - yatra: homepage form only (scraper/forms/yatra.py); never hit the
#   PerimeterX-challenged XHR trigger directly.
# - spicejet/akasa/indigo/airindia: homepage-form flows in scraper/forms/
#   (form-first, one deep-link fallback on SelectorNotFound).
enabled_sources:
  indigo_direct: true
  airindia_direct: true
  airindia_express: true
  akasa_direct: true
  spicejet_direct: true
  makemytrip: true
  yatra: true
  easemytrip: true
  cleartrip: true
  ixigo: true
  goibibo: true

politeness:
  delay_seconds: 2.0
  concurrent_per_domain: 1
  respect_robots_txt: true
