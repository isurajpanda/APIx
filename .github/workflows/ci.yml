name: apix-ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL + TimescaleDB + Memcached (native, no Docker)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-14 postgresql-client memcached libmemcached-dev
          sudo sh -c "echo 'deb https://packagecloud.io/timescale/timescaledb/ubuntu/ $(lsb_release -c -s) main' > /etc/apt/sources.list.d/timescaledb.list"
          wget -qO - https://packagecloud.io/timescale/timescaledb/gpgkey | sudo apt-key add -
          sudo apt-get update && sudo apt-get install -y timescaledb-2-postgresql-14
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo service postgresql start
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - run: pytest -q
